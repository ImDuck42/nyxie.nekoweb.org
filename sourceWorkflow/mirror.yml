name: Mirror to NekoWeb version

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  TARGET_USER: "ImDuck42"          # Target GitHub Account
  TARGET_REPO: "nyxie.nekoweb.org" # Target GH-Repo Name
  TARGET_DIR:  "nyxie.nekoweb.org" # This is the directory based of the target GH-Repos root /

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      # Check out Source repository
      - name: Checkout Source Repository
        uses: actions/checkout@v7
        with:
          path: source

      # Check out Destination repository
      - name: Checkout Destination Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_USER }}/${{ env.TARGET_REPO }}
          token:      ${{ secrets.DEPLOY_TOKEN }}
          path:       dest
          ref:        main

      # Sync source with destination target and Edit via nekoweb.json
      - name: Sync and Edit
        run: |
          # Make sure target directory exists
          mkdir -p "dest/${TARGET_DIR}"

          # Sync source to destination target
          rsync -av --delete source/ "dest/${TARGET_DIR}/"

          # Python script executing all rules top to bottom
          python3 - << 'EOF'
          import os
          import re
          import json
          import shutil
          import fnmatch
          from   pathlib import Path

          # Target the subfolder from the global TARGET_DIR variable
          target_dir_name = os.environ.get("TARGET_DIR", "nyxie.nekoweb.org")
          dest_dir = Path("dest") / target_dir_name

          # Find nekoweb.json inside the source repo
          nekoweb_config = list(Path("source").rglob("nekoweb.json"))
          if not nekoweb_config:
            print("Warning: No nekoweb.json found in repository. Aborting.")
            exit(1)
          else:
            print(f"Loaded config from: {nekoweb_config[0]}")
            with open(nekoweb_config[0], "r", encoding="utf-8") as file:
              config = json.load(file)

          # Normalize ./ and / paths relative to repo root
          def clean_path(path: str) -> str:
            path = path.strip()
            while path.startswith("./") or path.startswith("/"):
              if path.startswith("./"):
                path = path[2:]
              else:
                path = path[1:]
            return path

          # ==================================================
          # MOVEMENTS
          # ==================================================
          movements = config.get("movements", {})
          for src_raw, dst_raw in movements.items():
            src_path = dest_dir / clean_path(src_raw)
            dst_path = dest_dir / clean_path(dst_raw)
            if src_path.exists():
              
              # Auto-create destination folder if non existent
              dst_path.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(src_path), str(dst_path))
              print(f"Moved: {src_raw} -> {dst_raw}")
            else:
              print(f"Warning: Movement source not found: {src_raw}")

          # ==================================================
          # EXCLUSIONS
          # ==================================================
          exclusions = config.get("exclusions", [])

          for root, dirs, files in os.walk(dest_dir, topdown=True):
            rel_root = Path(root).relative_to(dest_dir).as_posix()
            if rel_root == ".":
              rel_root = ""
            
            # Delete matching directories
            for directory in list(dirs):
              rel_dir_path = f"{rel_root}/{directory}".strip("/")
              for path in exclusions:
                if fnmatch.fnmatch(directory.lower(), path.lower()) or fnmatch.fnmatch(rel_dir_path.lower(), path.lower()):
                  full_dir = os.path.join(root, directory)
                  shutil.rmtree(full_dir, ignore_errors=True)
                  dirs.remove(directory)
                  break
            
            # Delete matching files
            for file in list(files):
              rel_file_path = f"{rel_root}/{file}".strip("/")
              for path in exclusions:
                if fnmatch.fnmatch(file.lower(), path.lower()) or fnmatch.fnmatch(rel_file_path.lower(), path.lower()):
                  full_file = os.path.join(root, file)
                  if os.path.exists(full_file):
                    os.remove(full_file)
                  break

          # ==================================================
          # RENAMES
          # ==================================================
          renames = config.get("renames", {})
          for old_raw, new_raw in renames.items():
            old_path = dest_dir / clean_path(old_raw)
            new_path = dest_dir / clean_path(new_raw)
            if old_path.exists():
              new_path.parent.mkdir(parents=True, exist_ok=True)
              old_path.rename(new_path)
              print(f"Renamed: {old_raw} -> {new_raw}")

          # ==================================================
          # REPLACEMENTS
          # ==================================================
          replacements = config.get("replacements", {})
          if replacements:
            sorted_keys = sorted(replacements.keys(), key=len, reverse=True)
            pattern     = re.compile("|".join(re.escape(k) for k in sorted_keys))

            for root, dirs, files in os.walk(dest_dir):
              for file in files:
                file_path = Path(root) / file
                try:
                  content = file_path.read_text(encoding="utf-8")
                except (UnicodeDecodeError, PermissionError):

                  # Binary files (images, fonts, zips, etc.) - skip
                  continue
                except Exception:
                  continue

                new_content, count = pattern.subn(lambda match: replacements[match.group(0)], content)
                if count > 0:
                  file_path.write_text(new_content, encoding="utf-8")

          print("Edits completed successfully!")
          EOF

      # Commit and Push
      - name: Commit and Push to Destination
        run: |
          cd dest

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all modifications, additions, and deletions
          git add -A

          # Commit and push if changes exist
          if ! git diff --staged --quiet; then
            git commit -m "Mirror: ${{ github.event.head_commit.message || 'Manually triggered mirror' }}"
            git push origin main
          else
            echo "No changes detected - Skipping push."
          fi